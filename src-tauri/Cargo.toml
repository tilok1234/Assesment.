[package]
name = "sprite-assembler"
version = "0.1.0"
description = "A procedural 8-bit sprite assembler"
authors = ["tilok1234"]
edition = "2021"

[lib]
name = "sprite_assembler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
