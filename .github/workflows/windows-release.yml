name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Validate source and release configuration
        run: |
          npm run check
          npm run check:release

      - name: Build NSIS installer and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "8-Bit Sprite Assembler v__VERSION__"
          releaseBody: "Windows installer for 8-Bit Sprite Assembler. Review WINDOWS_RELEASE.md before publishing."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Verify generated installer
        run: npm run check:release -- --require-artifact
